name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - name: 契约快照（API v1 / SSE golden / 配置）
        run: uv run pytest tests/test_api_v1.py tests/test_chat_api.py tests/test_config_model.py -q
      - name: 领域词与 Pack 资产检查
        run: uv run pytest tests/test_domain_leakage.py tests/test_packs.py -q
      - name: 全量测试
        run: uv run pytest -q
      - name: CLI 冒烟
        run: |
          uv run python -m app.cli --help
          uv run python -m app.cli validate --help

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
